# Bare-metal CI, run on pull requests.
#
# Two jobs:
#  - rootless: installs the venv with uv and runs the test suite as the
#    default (non-root) runner user. Tests that require root are skipped via
#    the `require_root` marker, so this job validates the rootless tests.
#  - test: performs the full `ipmininet.install -a` (FRRouting, libyang,
#    mininet, ...) and runs the complete test suite with root privileges.
#
# Lint/format checks run in the `rootless` job below, before the light tests.
#
# This workflow only runs on pull requests: master changes arrive through
# merged PRs whose checks already ran here, so re-running this suite on every
# master push would duplicate the coverage-gated `heavy-test.yaml` job. Master
# pushes keep that job plus `container-test.yaml` and `docs.yaml`.
name: Test IPMininet
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rootless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Mininet dependency must be mimi-net fork
        run: grep -q 'mimi-net/mininet' pyproject.toml || (echo "mininet dependency must point to mimi-net/mininet.git fork" && exit 1)
      - run: uv sync --all-extras
      - name: Lint and format checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mdformat --check README.md LICENSE.md ipmininet/examples/README.md
      - name: Check for duplicated code
        run: scripts/check-duplicates.sh
      - name: Run rootless tests (coverage)
        run: |
          uv run python -m pytest \
            -v \
            --cov=ipmininet \
            --cov-fail-under=0 \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            ipmininet/tests/test_pure.py \
            ipmininet/tests/test_misc.py \
            ipmininet/tests/test_link.py \
            ipmininet/tests/test_network_capture.py \
            ipmininet/tests/test_dhcp.py
      - name: Upload coverage report (rootless)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rootless
          path: |
            coverage.xml
            htmlcov/
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: rootless
          slug: ${{ github.repository }}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Mininet dependency must be mimi-net fork
        run: grep -q 'mimi-net/mininet' pyproject.toml || (echo "mininet dependency must point to mimi-net/mininet.git fork" && exit 1)
      - run: uv sync --all-extras
      - name: Record OS version for the deps cache key
        run: echo "OS=$(. /etc/os-release && echo $VERSION_ID)" >> "$GITHUB_ENV"
      - name: Cache compiled deps
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: /home/runner/ci-deps
          key: ci-deps-${{ runner.os }}-${{ env.OS }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'ipmininet/install/install.py', 'ipmininet/install/utils.py', 'ipmininet/install/__main__.py') }}
      - name: Restore compiled deps
        if: steps.cache-deps.outputs.cache-hit == 'true'
        run: scripts/ci-restore-deps.sh
      - name: Install dependencies (FRRouting, libyang, mininet)
        timeout-minutes: 10
        run: |
          sudo env "PATH=$PATH" uv run python -m ipmininet.install -a
      - name: Save compiled deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: scripts/ci-save-deps.sh
      - name: Install mimidump
        run: scripts/ci-install-mimidump.sh
      - name: Run test suite
        timeout-minutes: 170
        run: |
          sudo env "PATH=$PATH" scripts/run-tests-parallel.sh

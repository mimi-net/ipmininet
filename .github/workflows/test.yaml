name: Test IPMininet
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Mininet dependency must be mimi-net fork
        run: grep -q 'mimi-net/mininet' pyproject.toml || (echo "mininet dependency must point to mimi-net/mininet.git fork" && exit 1)
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github
      - run: uv run mdformat --check .
      - name: No noqa or type:ignore in .py files
        run: |
          if [ "$(grep -rn '# noqa' ipmininet --include='*.py' | grep -v '__init__.py' | wc -l)" -ne 0 ]; then echo "Found # noqa outside __init__.py"; exit 1; fi
          if grep -rn '# type: ignore' ipmininet --include='*.py'; then echo "Found # type: ignore comments"; exit 1; fi
      - name: Coverage configs must be identical
        run: diff .coveragerc ipmininet/.coveragerc || (echo ".coveragerc and ipmininet/.coveragerc must be identical" && exit 1)
      - name: Shellcheck scripts
        run: uv run shellcheck scripts/*.sh
      - run: sudo env "PATH=$PATH" uv run python -m ipmininet.install -a
      - run: sudo env "PATH=$PATH" uv run pytest --cov-config=.coveragerc --cov=ipmininet/ -v --ignore=ipmininet/tests/test_exabgp.py --ignore=ipmininet/tests/test_openr.py
# Containerized CI.
#
# Builds a self-contained image with the full install (-a: FRRouting, libyang,
# mininet, radvd, sshd, named) plus the uv venv, then runs a subset of tests
# inside it with root privileges.
name: Container test
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache test container
        uses: docker/build-push-action@v6
        with:
          file: Containerfile
          target: final
          push: false
          load: true
          tags: ipmininet-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run test subset with coverage
        run: |
          docker run --rm --privileged \
            -v $PWD:/workspace:Z \
            -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e DEBIAN_FRONTEND=noninteractive \
            ipmininet-dev \
            scripts/ci-test.sh \
              ipmininet/tests/test_misc.py ipmininet/tests/test_pure.py \
              ipmininet/tests/test_dns.py

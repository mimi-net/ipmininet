# Containerized CI.
#
# Builds a two-stage image: the builder runs the full install (-a: FRRouting,
# libyang, mininet, radvd, sshd, named) plus the uv venv and mimidump, and the
# slim runtime stage keeps only the test-facing packages and the compiled
# artifacts. Runs the full test suite inside it with root privileges. Every
# worker runs in its own isolated namespace (scripts/run-tests-parallel.sh),
# mirroring the bare-metal job but in a reproducible environment.
#
# Runs on pull requests and on demand; master pushes keep this job too.
name: Container test
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and cache test container
        uses: docker/build-push-action@v7
        with:
          file: Containerfile
          target: final
          push: false
          load: true
          tags: ipmininet-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run full test suite
        run: |
          docker run --rm --privileged \
            -v $PWD:/workspace:Z \
            -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e DEBIAN_FRONTEND=noninteractive \
            ipmininet-dev \
            scripts/ci-test.sh

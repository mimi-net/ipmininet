[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ipmininet"
version = "1.1"
requires-python = ">=3.12"
description = "A mininet extension providing components to emulate IPnetworks running multiple protocols."
keywords = [ "networking", "OSPF", "IP", "BGP", "quagga", "mininet",]
classifiers = [ "License :: OSI Approved :: GNU General Public License v2 (GPLv2)", "Programming Language :: Python", "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Topic :: System :: Networking", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9",]
dependencies = [ "setuptools", "mako>=1.1,<1.5", "mininet @ git+https://github.com/mimi-net/mininet.git",]

[[project.authors]]
name = "Olivier Tilmans"
email = "olivier.tilmans@uclouvain.be"

[[project.authors]]
name = "Mathieu Jadin"
email = "mathieu.jadin@uclouvain.be"

[project.license]
text = "GPLv2"

[project.urls]
Homepage = "https://github.com/cnp3/ipmininet"

[project.optional-dependencies]
testing = [ "pytest", "pytest-timeout", "pytest-xdist",]

[dependency-groups]
docs = [ "sphinx", "sphinx_rtd_theme", "sphinxcontrib-apidoc", "sphinx-mdinclude",]
dev = [ "mdformat", "pre-commit", "ruff",]

[tool.aliases]
test = "pytest"

[tool.pytest.ini_options]
timeout = 600
timeout_method = "signal"
markers = [
    "require_root: test requires root privileges",
    "require_exabgp: test requires a working ExaBGP daemon",
    "require_openr: test requires the OpenR daemon",
    "require_mimidump: test requires the mimidump capture tool",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "RUF",
  "PERF",
  "FURB",
  "FLY",
  "TRY",
  "BLE",
  "PLC0206",
  "PLW0603",
  "PLW1510",
  "PLW1641",
  "PLW2901",
]
ignore = [ "E501", "TRY003", "PLC0415",]

[tool.mdformat]
wrap = "keep"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false

[build-system]
requires = [ "setuptools>=61.2",]
build-backend = "setuptools.build_meta"

[project]
name = "ipmininet"
version = "1.2.7"
requires-python = ">=3.12"
description = "A mininet extension providing components to emulate IPnetworks running multiple protocols."
keywords = [ "networking", "OSPF", "IP", "BGP", "quagga", "mininet",]
classifiers = [ "License :: OSI Approved :: GNU General Public License v2 (GPLv2)", "Programming Language :: Python", "Development Status :: 4 - Beta", "Intended Audience :: Developers", "Topic :: System :: Networking", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.6", "Programming Language :: Python :: 3.7", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9",]
dependencies = [ "setuptools", "mako>=1.1,<1.5", "mininet @ git+https://github.com/mimi-net/mininet.git",]

[[project.authors]]
name = "Olivier Tilmans"
email = "olivier.tilmans@uclouvain.be"

[[project.authors]]
name = "Mathieu Jadin"
email = "mathieu.jadin@uclouvain.be"

[project.license]
text = "GPLv2"

[project.urls]
Homepage = "https://github.com/cnp3/ipmininet"

[project.optional-dependencies]
testing = [ "coverage", "pytest", "pytest-cov", "pytest-timeout", "pytest-xdist",]

[dependency-groups]
docs = [ "sphinx", "sphinx_rtd_theme", "sphinxcontrib-apidoc", "sphinx-mdinclude",]
dev = [ "mdformat", "pylint", "pre-commit", "ruff",]

[tool.aliases]
test = "pytest"

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage"
omit = [
  "ipmininet/examples/*",
  "ipmininet/install/*",
  "ipmininet/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 84

[tool.ipmininet]
duplication_max = 51

[tool.pylint]

[tool.pylint.messages_control]
disable = "all"
enable = "duplicate-code"

[tool.pylint.similarities]
min-similarity-lines = 4

[tool.pytest.ini_options]
timeout = 600
timeout_method = "signal"
markers = [
    "require_root: test requires root privileges",
    "require_exabgp: test requires a working ExaBGP daemon",
    "require_mimidump: test requires the mimidump capture tool",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "RUF",
  "PERF",
  "FURB",
  "FLY",
  "TRY",
  "E501",
  "TRY003",
  "PLR2004",
  "PLR0913",
  "PLR0917",
  "PLC0415",
  "PLR0912",
  "PLR0911",
  "PLR0915",
  "PLC0206",
  "PLW0603",
  "PLW1510",
  "PLW1641",
  "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# E501: lines that cannot be reflowed (ASCII-art diagram, shell command
# strings, a literal `ip addr` output fixture).
"ipmininet/examples/simple_ospf_network.py" = ["E501"]
"ipmininet/install/install.py" = ["E501", "TRY003"]
"ipmininet/tests/test_pure.py" = ["E501"]
# Architectural rules deferred for existing files (see NOTES.md):
# - PLC0415: intentional circular-import avoidance
# - TRY003: requires per-message exception classes
# - PLR2004: requires named constants for IP/protocol magic values
# - PLR0913/PLR0917/PLR0912/PLR0911/PLR0915: require function refactors
"ipmininet/examples/exabgp_prefix_injector.py" = ["PLR2004"]
"ipmininet/examples/ripng_network_adjust.py" = ["PLR0913", "PLR0917"]
"ipmininet/examples/spanning_tree_adjust.py" = ["PLR0913", "PLR0917"]
"ipmininet/host/config/named.py" = ["PLR0912", "PLR0913", "PLR0917", "PLR2004"]
"ipmininet/install/utils.py" = ["PLC0415", "TRY003"]
"ipmininet/ipnet.py" = ["PLR0912", "PLR0913", "PLR0917", "PLR2004", "TRY003"]
"ipmininet/ipovs_switch.py" = ["PLR0913", "PLR0917", "TRY003"]
"ipmininet/ipswitch.py" = ["PLR0913", "PLR0917"]
"ipmininet/iptopo.py" = ["TRY003"]
"ipmininet/link.py" = ["PLR0911", "PLR2004", "TRY003"]
"ipmininet/node_description.py" = ["PLR2004", "TRY003"]
"ipmininet/overlay.py" = ["TRY003"]
"ipmininet/router/__router.py" = ["PLR0913", "PLR0917"]
"ipmininet/router/config/base.py" = ["PLC0415", "TRY003"]
"ipmininet/router/config/bgp.py" = ["PLR0913", "PLR0917", "TRY003"]
"ipmininet/router/config/exabgp.py" = ["TRY003"]
"ipmininet/router/config/iptables.py" = ["TRY003"]
"ipmininet/router/config/utils.py" = ["PLR2004"]
"ipmininet/router/config/zebra.py" = ["PLR0913", "PLR0917", "PLR2004", "TRY003"]
"ipmininet/srv6.py" = ["PLR0913", "PLR0917", "PLR2004", "TRY003"]
"ipmininet/tests/test_gre.py" = ["PLR2004"]
"ipmininet/tests/test_link.py" = ["PLR2004"]
"ipmininet/tests/test_misc.py" = ["PLR2004"]
"ipmininet/tests/test_radv.py" = ["TRY003"]
"ipmininet/tests/test_srv6.py" = ["PLR0912", "PLR0915", "PLR2004"]
"ipmininet/tests/test_sshd.py" = ["PLR2004"]
"ipmininet/tests/test_tc.py" = ["PLR2004"]
"ipmininet/tests/utils.py" = ["PLR0913", "PLR0917", "PLR2004", "TRY003"]
"ipmininet/topologydb.py" = ["TRY003"]
"ipmininet/utils.py" = ["PLC0415", "TRY003"]

[tool.mdformat]
wrap = "keep"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
